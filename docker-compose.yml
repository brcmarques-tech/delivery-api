services:
  app:
    build: .
    container_name: shopping-api
    command: sh -c "yarn install && npx nest start --watch"
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: shopping
      DB_PASSWORD: teste123
      DB_DATABASE: shopping_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-secret-change-in-production
      JWT_EXPIRATION: 7d
      PORT: 3000
      # KAN-222: segredos vêm do .env (gitignored) por substituição — não versionar.
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_FROM: BCM TECH SHOPPING <noreply@bcmtech.com.br>
      CLOUDINARY_CLOUD_NAME: dgbavxge6
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      PAGARME_SECRET_KEY: ${PAGARME_SECRET_KEY}
      PAGARME_PUBLIC_KEY: ${PAGARME_PUBLIC_KEY}
      PAGARME_PLATFORM_RECIPIENT_ID: ${PAGARME_PLATFORM_RECIPIENT_ID}
      APP_URL: http://localhost:3000
      VENDOR_APP_URL: http://localhost:3001
      SERPAPI_KEY: ${SERPAPI_KEY}
      GOOGLE_CLIENT_ID: 194367338134-2svkdsl9amt5qfihsqabt438l2sj1pj8.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      WAHA_API_URL: http://18.231.9.158
      WAHA_API_KEY: ${WAHA_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      WAHA_WEBHOOK_SECRET: ${WAHA_WEBHOOK_SECRET}
      AGENT_APP_USER_EMAIL: agente@bcmtech.com.br
      N8N_AGENT_KEY: ${N8N_AGENT_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: shopping-postgres
    environment:
      POSTGRES_USER: shopping
      POSTGRES_PASSWORD: teste123
      POSTGRES_DB: shopping_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shopping -d shopping_db']
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shopping-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  n8n:
    image: n8nio/n8n:latest
    container_name: shopping-n8n
    restart: unless-stopped
    ports:
      - '5678:5678'
    environment:
      N8N_BASIC_AUTH_USER: admin
      # KAN-222: senha/chave do n8n vêm do .env por substituição — não versionar.
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_CONCURRENCY_PRODUCTION_LIMIT: "-1"
      # Variaveis para usar nos workflows
      API_BASE_URL: http://shopping-api:3000
      N8N_AGENT_KEY: ${N8N_AGENT_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      WAHA_API_URL: http://18.231.9.158
      WAHA_API_KEY: ${WAHA_API_KEY}
      # KAN-220: usados pelo workflow "Contato Site" (webhook do formulario).
      # RESEND_API_KEY vem do .env (gitignored) por substituicao — nao versionar
      # a chave. CONTACT_WEBHOOK_SECRET e um token nao-sensivel (default abaixo),
      # deve casar com o CONTACT_WEBHOOK_SECRET do site (.env.local).
      RESEND_API_KEY: ${RESEND_API_KEY}
      CONTACT_WEBHOOK_SECRET: ${CONTACT_WEBHOOK_SECRET:-bcmtech-contato-2026}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - app
      - redis

volumes:
  postgres_data:
  redis_data:
  n8n_data:
