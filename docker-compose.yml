services:
  app:
    build: .
    container_name: shopping-api
    command: sh -c "yarn install && npx nest start --watch"
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: shopping
      DB_PASSWORD: teste123
      DB_DATABASE: shopping_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-secret-change-in-production
      JWT_EXPIRATION: 7d
      PORT: 3000
      RESEND_API_KEY: re_fLvy9LTQ_PWEdzcqWyNwajCqEXY3wiQGw
      MAIL_FROM: BCM TECH SHOPPING <noreply@bcmtech.com.br>
      CLOUDINARY_CLOUD_NAME: dgbavxge6
      CLOUDINARY_API_KEY: 279355333423469
      CLOUDINARY_API_SECRET: lILGnp653qtQQmOGV0uQVDn4Uew
      PAGARME_SECRET_KEY: sk_test_6f0b7122384f431faa8b0c6b19463425
      PAGARME_PUBLIC_KEY: pk_test_aMzdnWyuDCykrpN2
      PAGARME_PLATFORM_RECIPIENT_ID: re_cmmutgjxn00d20l9tbqyidmmf
      APP_URL: http://localhost:3000
      VENDOR_APP_URL: http://localhost:3001
      SERPAPI_KEY: a0e65ca2095765511a9001e46e1eaeba5fdc0c5d40dc4c156f7097f59c3e0521
      GOOGLE_CLIENT_ID: 194367338134-2svkdsl9amt5qfihsqabt438l2sj1pj8.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: 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
      WAHA_API_URL: http://18.231.9.158
      WAHA_API_KEY: bcmtech-waha-2026-key
      GEMINI_API_KEY: AIzaSyAGr-yytwNTUCpVUmxl1R4mTSiK_jorRFQ
      WAHA_WEBHOOK_SECRET: bcmtech-waha-webhook-2026
      AGENT_APP_USER_EMAIL: agente@bcmtech.com.br
      N8N_AGENT_KEY: bcmtech-n8n-agent-2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: shopping-postgres
    environment:
      POSTGRES_USER: shopping
      POSTGRES_PASSWORD: teste123
      POSTGRES_DB: shopping_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shopping -d shopping_db']
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shopping-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  n8n:
    image: n8nio/n8n:latest
    container_name: shopping-n8n
    restart: unless-stopped
    ports:
      - '5678:5678'
    environment:
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: bcmtech2026
      N8N_ENCRYPTION_KEY: bcmtech-n8n-encryption-key-2026
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      WEBHOOK_URL: http://localhost:5678/
      # Variaveis para usar nos workflows
      API_BASE_URL: http://shopping-api:3000
      N8N_AGENT_KEY: bcmtech-n8n-agent-2026
      GEMINI_API_KEY: AIzaSyAGr-yytwNTUCpVUmxl1R4mTSiK_jorRFQ
      WAHA_API_URL: http://18.231.9.158
      WAHA_API_KEY: bcmtech-waha-2026-key
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - app
      - redis

volumes:
  postgres_data:
  redis_data:
  n8n_data:
